<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ligooo AI</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff0f6,#f5eaff);color:#24202a;min-height:100vh}
    .wrap{max-width:760px;margin:auto;padding:28px 18px 50px}
    .hero{text-align:center;margin-bottom:24px}
    .logo{font-size:46px;font-weight:900;letter-spacing:-2px}
    .logo span{color:#ff4f91}
    .tag{margin:8px 0;color:#6d6472}
    .card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 10px 35px #00000012;margin:16px 0}
    h2{margin:0 0 14px;font-size:20px}
    .drop{border:2px dashed #ff8bb6;border-radius:18px;padding:28px;text-align:center;cursor:pointer;background:#fff8fb}
    .drop:hover{background:#fff0f6}
    input[type=file]{display:none}
    #preview{max-width:100%;max-height:300px;border-radius:16px;margin-top:16px;display:none}
    .modes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    button{border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;cursor:pointer}
    .mode{background:#f3edf5;color:#413746}
    .mode.active{background:#ff4f91;color:white}
    .main{width:100%;background:#ff4f91;color:white;margin-top:18px;font-size:18px}
    .main:disabled{opacity:.5;cursor:not-allowed}
    #result{white-space:pre-wrap;line-height:1.55;background:#faf7fb;border-radius:16px;padding:18px;display:none}
    .small{font-size:13px;color:#817784;text-align:center}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="logo">Lig<span>ooo</span> ✨</div>
      <div class="tag">Tu asistente para saber qué responder.</div>
    </div>

    <div class="card">
      <h2>📸 Sube una captura</h2>
      <label class="drop" for="image">
        <strong>Toca para elegir una imagen</strong><br>
        <span class="small">Sube la captura de tu conversación</span>
        <input id="image" type="file" accept="image/*">
      </label>
      <img id="preview" alt="Vista previa">
    </div>

    <div class="card">
      <h2>💬 ¿Qué estilo quieres?</h2>
      <div class="modes">
        <button class="mode active" data-mode="seguro">😎 Seguro</button>
        <button class="mode" data-mode="caliente">😏 Caliente</button>
        <button class="mode" data-mode="enamorar">❤️ Enamorar</button>
        <button class="mode" data-mode="chistoso">😂 Chistoso</button>
        <button class="mode" data-mode="salvar">🛟 Salvar</button>
      </div>
      <button id="generate" class="main" disabled>✨ Dime qué responder</button>
    </div>

    <div class="card" id="resultCard" style="display:none">
      <h2>💡 Ligooo dice:</h2>
      <div id="result"></div>
    </div>

    <div class="small">Ligooo AI · Modo demo disponible sin API</div>
  </div>

<script>
let selectedMode="seguro";
let selectedFile=null;

const imageInput=document.getElementById("image");
const preview=document.getElementById("preview");
const generate=document.getElementById("generate");
const result=document.getElementById("result");
const resultCard=document.getElementById("resultCard");

document.querySelectorAll(".mode").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".mode").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    selectedMode=btn.dataset.mode;
  });
});

imageInput.addEventListener("change",()=>{
  selectedFile=imageInput.files[0]||null;
  if(!selectedFile)return;
  preview.src=URL.createObjectURL(selectedFile);
  preview.style.display="block";
  generate.disabled=false;
});

generate.addEventListener("click",async()=>{
  if(!selectedFile)return;
  generate.disabled=true;
  generate.textContent="⏳ Pensando...";
  resultCard.style.display="block";
  result.style.display="block";
  result.textContent="Ligooo está analizando la captura...";

  const reader=new FileReader();
  reader.onload=async()=>{
    try{
      const response=await fetch("/api/generate",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          image:reader.result,
          mimeType:selectedFile.type,
          mode:selectedMode
        })
      });
      const data=await response.json();
      if(!response.ok) throw new Error(data.error||"Error del servidor");
      result.textContent=data.answer||"No recibí una respuesta.";
    }catch(e){
      result.textContent="⚠️ "+e.message;
    }finally{
      generate.disabled=false;
      generate.textContent="✨ Dime qué responder";
    }
  };
  reader.readAsDataURL(selectedFile);
});
</script>
</body>
</html>
